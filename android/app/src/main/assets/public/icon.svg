<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6ee7b7" stroke-width="8" opacity="0.3"/>

  <!-- Health Shield / Digestive Heart Symbol -->
  <g filter="url(#shadow)" transform="translate(256, 256) scale(0.9) translate(-256, -256)">
    <!-- Stylized Digestive Tract / Shield -->
    <path d="M 256 120 C 330 120 380 170 380 250 C 380 340 280 400 256 415 C 232 400 132 340 132 250 C 132 170 182 120 256 120 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Gentle Digestive Wave / Core -->
    <path d="M 210 230 C 230 200 280 200 300 230 C 320 260 270 290 290 320" fill="none" stroke="#059669" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Calming spark / leaf -->
    <circle cx="210" cy="230" r="12" fill="#10b981"/>
    <circle cx="290" cy="320" r="12" fill="#10b981"/>
    
    <!-- Top Leaf -->
    <path d="M 256 120 C 270 80 310 70 330 75 C 330 100 300 120 256 120 Z" fill="url(#leafGrad)"/>
  </g>
</svg>
